# Per-trip scrapbook for /trips/. Distinct from /travel/ countries globe.
# public: true|false is published visibility for guests (not a site-wide gate).
# Private trips appear on the index only after site.admin unlock.
# Flip public: true on a trip and merge to share that trip. Do not invent itinerary.


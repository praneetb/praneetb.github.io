    palate: Smooth and warm — gentle spice, tropical fruit, and a light nuttiness.
    finish: Medium-long, balanced, with lingering fruit and oak.
    image: /assets/whiskey/indri.png
    image_note: Official ImpEx / Piccadily Indri Trini bottle shot (The Three Wood).
    credit: ImpEx Beverages / Piccadily (Indri Trini product image)


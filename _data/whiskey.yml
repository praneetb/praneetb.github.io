# Private whiskey bar catalog.
# Tasting notes are short paraphrases of widely published public notes — not verbatim reviews.
# image_note records closest-SKU substitutions when an exact official cutout was unavailable.

shelves:
  - id: premium
    name: Premium
    icon: crown
    kicker:
      summit: Exceptional. Rare. Extraordinary.
      atlas: The high shelf. The long pour.
      cadence: Rare. Measured. Worth the wait.
    glass: crystal
  - id: core
    name: Core
    icon: diamond
    kicker:
      summit: Signature. Balanced. Refined.
      atlas: The working collection.
      cadence: Everyday craft, mid-shelf calm.
    glass: glencairn
  - id: everyday
    name: Everyday
    icon: house
    kicker:
      summit: Reliable. Approachable. Always a good choice.
      atlas: Open the bottle. Start the night.
      cadence: Familiar. Friendly. Ready.
    glass: tumbler

bottles:
  - id: macallan-rare-cask
    name: Macallan Rare Cask
    brand: The Macallan
    shelf: premium
    occasion: Special
    region: Speyside
    type: Single malt Scotch
    age:
    abv: 43
    tags: [sherry, dried-fruit, spice, chocolate]
    nose: Deep dried fruit, dark chocolate, and polished oak from first-fill sherry casks.
    palate: Rich raisin and fig, warm spice, and a velvety oak sweetness.
    finish: Long, warming, with lingering cocoa and orange peel.
    image: /assets/whiskey/macallan-rare-cask.png
    image_note: Official The Macallan 2024 Rare Cask brand-asset pack shot, bottle isolated.
    credit: The Macallan / Edrington brand assets

  - id: macallan-18
    name: Macallan 18
    brand: The Macallan
    shelf: premium
    occasion: Occasional
    region: Speyside
    type: Single malt Scotch
    age: 18
    abv: 43
    tags: [sherry, dried-fruit, ginger, oak]
    nose: Dried fruit, ginger, and cinnamon over seasoned sherry oak.
    palate: Orange peel, toasted oak, and a slow spice warmth.
    finish: Long and drying, with fruitcake and oak tannin.
    image: /assets/whiskey/macallan-18.png
    image_note: Cropped from a Commons photo of the Colour Collection 12/15/18 lineup.
    credit: Wikimedia Commons (Macallan whisky, 12-15-18 years.jpg)

  - id: glenlivet-25
    name: Glenlivet 25
    brand: The Glenlivet
    shelf: premium
    occasion:
    region: Speyside
    type: Single malt Scotch
    age: 25
    abv: 43
    tags: [fruity, oak, sherry, tropical]
    nose: Ripe orchard fruit, honeyed oak, and a quiet sherry sweetness.
    palate: Silkier than the younger bottles — tropical fruit, toasted almond, gentle spice.
    finish: Long, elegant, with lingering citrus oil and oak.
    image: /assets/whiskey/glenlivet-25.png
    image_note: Closest rights-safe photo is The Glenlivet 12 (Commons). Exact 25 SKU cutout unavailable.
    credit: Wikimedia Commons (The Glenlivet 12 year old whisky.jpg)

  - id: lagavulin-16
    name: Lagavulin 16
    brand: Lagavulin
    shelf: premium
    occasion:
    region: Islay
    type: Single malt Scotch
    age: 16
    abv: 43
    tags: [peaty, smoky, seaweed, iodine]
    nose: Dense peat smoke, iodine, and seaweed over a deep sweetness.
    palate: Dry smoke first, then salt, oak, and a gentle malt sweetness.
    finish: Long, maritime, and peat-filled.
    image: /assets/whiskey/lagavulin-16.png
    image_note: Product-style bottle reconstructed from Commons photo of Lagavulin 16 (box isolation failed).
    credit: Visual based on Wikimedia Commons (Lagavulin Single Islay Malt 16.jpg)

  - id: indri

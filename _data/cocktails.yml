items:
  - id: old-fashioned
    name: Old Fashioned
    method: stirred
    glass: rocks glass
    tags: [stirred, rum]
    garnish: Orange slice and a maraschino cherry
    serve: Stir with ice, pour over large ice, garnish.
    video:
    poster:
    ingredients:
      - amount: ¼ oz
        name: Demerara syrup
      - amount: 4 dashes
        name: Angostura bitters
      - amount: 2 fl oz
        name: Jamaican rum
    steps:
      - Stir with ice.
      - Pour over large ice.
      - Garnish.


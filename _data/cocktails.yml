    video:
    poster:
    ingredients:
      - amount: 1 oz
        name: Appleton 12yr
      - amount: 1 oz
        name: La Favorite Ambre
      - amount: ½ oz
        name: Kōloa Dark
      - amount: ¾ oz
        name: Pierre Ferrand Dry Curaçao
      - amount: 1 oz
        name: Lime
      - amount: ½ oz
        name: Orgeat
      - amount: float
        name: 151 (flame)
    steps:
      - Shake with ice and strain.
      - Float / flame 151.

  - id: long-island
    name: Long Island Iced Tea
    method: built
    glass: highball
    tags: [built]
    garnish: Lemon and mint
    serve: Lemon + mint.
    video:
    poster:
    ingredients:
      - amount: ½ oz
        name: Vodka
      - amount: ½ oz
        name: Rum
      - amount: ½ oz
        name: Gin
      - amount: ½ oz
        name: Tequila
      - amount: ½ oz
        name: Triple sec
      - amount: 1 oz
        name: Sweet & sour
      - amount: 1 oz
        name: Cola

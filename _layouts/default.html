<!DOCTYPE html>
<html lang="en"{% if page.nav == 'travel' %} class="theme-travel"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.nav != 'home' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% if page.robots %}
  <meta name="robots" content="{{ page.robots }}">
  {% endif %}
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta name="theme-color" content="{% if page.nav == 'travel' %}#07090e{% else %}#f3efe6{% endif %}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.extra_css %}
    {% for href in page.extra_css %}
  <link rel="stylesheet" href="{{ href | relative_url }}">
    {% endfor %}
  {% endif %}
</head>
<body{% if page.nav == 'travel' %} class="theme-travel"{% endif %}>
  <a class="skip-link" href="#content">Skip to content</a>
  {% include nav.html %}
  <main id="content" class="page page-{{ page.nav }}">
    {{ content }}
  </main>
  {% include footer.html %}
  {% if page.extra_js %}
    {% for src in page.extra_js %}
  <script src="{{ src | relative_url }}"></script>
    {% endfor %}
  {% endif %}
</body>
</html>

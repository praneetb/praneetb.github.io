<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/rose.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  {% include nav.html %}
  <main id="content" class="page page-rose">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site-admin.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/rose-gate.js' | relative_url }}"></script>
</body>
</html>

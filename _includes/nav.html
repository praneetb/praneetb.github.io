<header class="site-header">
  <div class="site-header-inner">
    <div class="theme-switch">
      <button
        type="button"
        class="theme-switch-toggle"
        id="theme-switch-toggle"
        aria-haspopup="true"
        aria-expanded="false"
        aria-controls="theme-menu"
        aria-label="Site theme, Summit">
        <span class="theme-swatch" data-theme-swatch="summit" aria-hidden="true"></span>
        <span class="theme-switch-current">Summit</span>
        <svg class="theme-switch-chevron" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.4 4.2 6 8l3.6-3.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="theme-switch-menu" id="theme-menu" role="menu" hidden>
        <button type="button" role="menuitemradio" aria-checked="true" data-theme-value="summit">
          <span class="theme-swatch" aria-hidden="true"></span>
          <span>Summit</span>
          <span class="theme-switch-check" aria-hidden="true"></span>
        </button>
        <button type="button" role="menuitemradio" aria-checked="false" data-theme-value="atlas">
          <span class="theme-swatch" aria-hidden="true"></span>
          <span>Atlas</span>
          <span class="theme-switch-check" aria-hidden="true"></span>
        </button>
        <button type="button" role="menuitemradio" aria-checked="false" data-theme-value="cadence">
          <span class="theme-swatch" aria-hidden="true"></span>
          <span>Cadence</span>
          <span class="theme-switch-check" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <a class="wordmark" href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>
      <span class="wordmark-mark" aria-hidden="true">
        <svg class="wordmark-mark-summit" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="16" fill="#5C5A56"/>
          <path d="M6 22.5 12.2 13l3.1 4.4L18.6 12 26 22.5H6z" fill="#F7F1E8" opacity=".92"/>
          <circle cx="16" cy="16" r="15.15" stroke="#F7F1E8" stroke-opacity=".22"/>
        </svg>
        <svg class="wordmark-mark-atlas" viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="15" fill="#023047"/>
          <path d="M16 3.2a12.8 12.8 0 0 1 0 25.6" fill="#00B4D8"/>
          <path d="M16 3.2a12.8 12.8 0 0 0 0 25.6" fill="#7B2CBF"/>
          <path d="M4.4 12.2h23.2A12.8 12.8 0 0 0 4.4 12.2z" fill="#FFB703"/>
          <circle cx="16" cy="16" r="12.8" stroke="#FFF8EF" stroke-width="1.2" stroke-opacity=".35"/>
        </svg>
        <svg class="wordmark-mark-cadence" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="16" fill="#1B1464"/>
          <path d="M3 18.2c1.4-2.6 2.6-4 3.8-4s2.2 2.6 3.4 2.6 2.4-4.8 3.8-4.8 2.6 6.2 4 6.2 2.2-3.6 3.6-3.6 2.6 3.2 3.8 3.2 2.4-2.4 3.6-2.4" stroke="#F4A261" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="16" cy="11.2" r="1.7" fill="#2EC4B6"/>
        </svg>
      </span>
      <span class="wordmark-text">Praneet Bachheti</span>
    </a>
    <nav class="nav nav-public" aria-label="Panels">
      <a href="{{ '/travel/' | relative_url }}"{% if page.nav == 'travel' %} aria-current="page"{% endif %}>Travel</a>
      <span class="nav-dot" aria-hidden="true">·</span>
      <a href="{{ '/bar/' | relative_url }}"{% if page.nav == 'bar' %} aria-current="page"{% endif %}>Bar</a>
      <span class="nav-dot" aria-hidden="true">·</span>
      <a href="{{ '/cocktails/' | relative_url }}"{% if page.nav == 'cocktails' %} aria-current="page"{% endif %}>Cocktails</a>
      <span class="nav-dot" aria-hidden="true">·</span>
      <a href="{{ '/food/' | relative_url }}"{% if page.nav == 'food' %} aria-current="page"{% endif %}>Food</a>
      <span class="nav-dot" aria-hidden="true">·</span>
      <a href="{{ '/recipes/' | relative_url }}"{% if page.nav == 'recipes' %} aria-current="page"{% endif %}>Recipes</a>
      <span class="nav-dot" aria-hidden="true">·</span>
      <a href="{{ '/fermentation/' | relative_url }}"{% if page.nav == 'fermentation' %} aria-current="page"{% endif %}>Fermentation</a>
      <span class="nav-dot" aria-hidden="true">·</span>
      <a href="{{ '/patents/' | relative_url }}"{% if page.nav == 'patents' %} aria-current="page"{% endif %}>Patents</a>
      <span class="nav-dot" aria-hidden="true">·</span>
      <a href="{{ '/bucket-list/' | relative_url }}"{% if page.nav == 'bucket' %} aria-current="page"{% endif %}>Bucket</a>
      <span class="nav-dot" aria-hidden="true">·</span>
      <a href="{{ '/violin/' | relative_url }}"{% if page.nav == 'violin' or page.nav == 'violin-piece' or page.nav == 'violin-practice' or page.nav == 'violin-recording' %} aria-current="page"{% endif %}>Violin</a>
      <span class="nav-dot" aria-hidden="true">·</span>
      <a href="{{ '/health/' | relative_url }}"{% if page.nav == 'health' %} aria-current="page"{% endif %}>Health</a>
    </nav>
    <nav id="site-private-nav" class="nav nav-private" aria-label="Private" hidden></nav>
    <div class="site-header-account">
      <button type="button" id="site-signin" class="site-signin">Sign in</button>
      <div id="site-account" class="site-account" hidden>
        <span class="site-avatar" aria-hidden="true">P</span>
        <button type="button" id="site-signout" class="site-signout">Sign out</button>
      </div>
    </div>
  </div>
  <p id="welcome-strip" class="welcome-strip" hidden>Welcome back</p>
</header>

<dialog id="site-admin-dialog" class="site-admin-dialog">
  <form id="site-admin-form">
    <h2>Sign in</h2>
    <label>
      Username
      <input id="site-admin-username" name="username" type="text" autocomplete="username" required>
    </label>
    <label>
      Password
      <input id="site-admin-password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <label class="site-admin-persist">
      <input id="site-admin-persist" name="persist" type="checkbox">
      Stay signed in on this device
    </label>
    <p id="site-admin-error" class="site-gate-error" hidden></p>
    <div class="site-admin-actions">
      <button id="site-admin-cancel" type="button">Cancel</button>
      <button type="submit">Sign in</button>
    </div>
  </form>
</dialog>

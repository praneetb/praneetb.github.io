---
layout: rose
title: Rose
permalink: /rose/
sitemap: false
nav: rose
---

<div id="rose-gate" class="rose-gate">
  <p class="kicker">Rose</p>
  <h1>Locked</h1>
  <p id="rose-gate-status" class="lede">This gate is not configured yet.</p>
  <form id="rose-gate-form" class="rose-gate-form" hidden>
    <label>
      Password
      <input id="rose-password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <p id="rose-gate-error" class="rose-gate-error" hidden></p>
    <button type="submit">Unlock</button>
  </form>
</div>

<div id="rose-dashboard-root" hidden></div>

<template id="rose-dashboard-template">
  <div class="rose-dashboard">
    <p class="kicker">Rose</p>
    <h1>Hours and pay</h1>
    <p class="rose-balance">${{ site.data.rose.current.amount_usd }}</p>
    <p class="lede">Current balance through {{ site.data.rose.current.as_of }} · {{ site.data.rose.current.hours }} hours · {{ site.data.rose.current.note }}</p>

    <ul class="rose-cards">
      <li>
        <h2>Rate</h2>
        <p>${{ site.data.rose.rate_usd_per_hour }} / hour</p>
        <p class="rose-muted">Tracking from {{ site.data.rose.tracking_starts }}</p>
      </li>
      <li>
        <h2>Running hours</h2>
        <p>{{ site.data.rose.current.hours }} hours</p>
        <p class="rose-muted">Through {{ site.data.rose.current.as_of }}</p>
      </li>
      <li>
        <h2>This week</h2>
        <p>{{ site.data.rose.this_week.hours }} hours · ${{ site.data.rose.this_week.amount_usd }}</p>
        <p class="rose-muted">{{ site.data.rose.this_week.label }} · {{ site.data.rose.this_week.note }}</p>
      </li>
      <li>
        <h2>Full month</h2>
        <p>{{ site.data.rose.full_month_if_scheduled.hours }} hours · ${{ site.data.rose.full_month_if_scheduled.amount_usd }}</p>
        <p class="rose-muted">{{ site.data.rose.full_month_if_scheduled.note }}</p>
      </li>
    </ul>

    <section class="rose-section" aria-labelledby="rose-schedule-heading">
      <h2 id="rose-schedule-heading">Weekly schedule</h2>
      <p class="rose-muted">{{ site.data.rose.weekly_hours }} hours / ${{ site.data.rose.weekly_amount_usd }} each week</p>
      <ul class="rose-schedule">
        {% for slot in site.data.rose.schedule %}
        <li>{{ slot.day }} {{ slot.hours }}h</li>
        {% endfor %}
      </ul>
    </section>

    <section class="rose-section" aria-labelledby="rose-payments-heading">
      <h2 id="rose-payments-heading">Payments</h2>
      {% assign payments = site.data.rose.payments %}
      {% if payments and payments.size > 0 %}
      <ul class="place-list">
        {% for payment in payments %}
        <li>
          <p class="place-name">${{ payment.amount_usd }}</p>
          <p class="place-meta">{{ payment.date }}{% if payment.note %} · {{ payment.note }}{% endif %}</p>
        </li>
        {% endfor %}
      </ul>
      {% else %}
      <p class="empty">None recorded.</p>
      {% endif %}
    </section>

    <section class="rose-section" aria-labelledby="rose-sessions-heading">
      <h2 id="rose-sessions-heading">Sessions</h2>
      <div class="rose-table-wrap">
        <table class="rose-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Day</th>
              <th class="num">Hours</th>
              <th class="num">Amount</th>
              <th>Status</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody>
            {% for session in site.data.rose.sessions %}
            <tr>
              <td>{{ session.date }}</td>
              <td>{{ session.weekday }}</td>
              <td class="num">{{ session.hours }}h</td>
              <td class="num">${{ session.amount_usd }}</td>
              <td>
                <span class="rose-status{% if session.status == 'scheduled' %} rose-status-scheduled{% endif %}">{{ session.status }}</span>
              </td>
              <td class="rose-note">{{ session.note }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </section>
  </div>
</template>
